# Refresh Adzuna jobs, build the static site, then deploy it to Cloudflare Pages
# (or upload it as a workflow artifact if the Cloudflare secrets are not set).
#
# Repository secrets:
#   ADZUNA_APP_ID, ADZUNA_APP_KEY                (required)
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  (optional; deploy is skipped without them)
#
# This repo is PUBLIC: the workflow never commits job data back to the repo.
# The SQLite DB is carried between runs with actions/cache only.
#
# API budget: 64 Adzuna calls per run (2 countries x 4 areas x 8 industries).
# Every 2 days = ~960 calls/month, inside Adzuna's default 250/day and 2,500/month.
name: refresh-jobs

on:
  schedule:
    - cron: "15 5 */2 * *"   # 05:15 UTC every second day
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Max Adzuna API calls for this run"
        default: "64"

permissions:
  contents: read

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_ADZUNA: ${{ secrets.ADZUNA_APP_KEY != '' && secrets.ADZUNA_APP_ID != '' }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Adzuna secrets
        if: ${{ env.HAS_ADZUNA != 'true' }}
        run: |
          echo "::error::Add repository secrets ADZUNA_APP_ID and ADZUNA_APP_KEY (Settings > Secrets and variables > Actions)."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Restore job DB
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.sqlite
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-

      - name: Fetch jobs from Adzuna
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          MAX_CALLS: ${{ github.event.inputs.max_calls || '64' }}
        run: python scripts/fetch_jobs.py --max-calls "$MAX_CALLS"

      - name: Build static site
        run: python scripts/build_site.py

      - name: Save job DB
        uses: actions/cache/save@v4
        with:
          path: data/jobs.sqlite
          key: jobs-db-${{ github.run_id }}

      - name: Deploy to Cloudflare Pages
        if: ${{ env.HAS_CLOUDFLARE == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=kaam-kotha-jobs --branch=main

      - name: Upload site artifact (when not deploying)
        if: ${{ env.HAS_CLOUDFLARE != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: kaam-kotha-jobs-site
          path: site/
          retention-days: 3
