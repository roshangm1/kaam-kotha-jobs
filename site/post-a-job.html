<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post a job free | Kaam Kotha Jobs</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header class="top"><a class="brand" href="index.html"><span class="logo" aria-hidden="true">का</span><span>Kaam Kotha <b>Jobs</b></span></a></header>
<main class="wrap narrow">
  <h1>Post a job free</h1>
  <p>Reach Nepali job seekers near your business in the UK and Australia. Free for founding employers. <span lang="ne">निःशुल्क काम पोस्ट गर्नुहोस्।</span></p>
  <p class="small notice">Prototype: this form is not connected yet. Nothing is sent or stored.</p>
  <form id="post" class="postform">
    <label>Business name<input required name="business"></label>
    <label>Country<select name="country"><option value="gb">United Kingdom</option><option value="au">Australia</option></select></label>
    <label>Job title<input required name="title" placeholder="e.g. Kitchen porter"></label>
    <label>Industry<select name="industry">
      <option>Care &amp; health</option><option>Restaurants &amp; kitchens</option><option>Retail &amp; grocery</option><option>Cleaning</option>
      <option>Warehouse</option><option>Security</option><option>Delivery &amp; driving</option><option>Hotels</option></select></label>
    <label>Postcode / suburb<input required name="where"></label>
    <label>Hourly pay<input required name="pay" type="number" step="0.01" min="0" placeholder="e.g. 12.71"></label>
    <label>Hours per week<input name="hours" type="number" min="1" max="60"></label>
    <label>How to apply (email or link)<input required name="apply"></label>
    <label>Job description<textarea name="desc" rows="5" placeholder="Duties, shifts, requirements"></textarea></label>
    <label class="chk"><input type="checkbox" required> I confirm the pay is at least the legal minimum, the job is legal, and candidates will not be charged any fee.</label>
    <button class="btn" type="submit">Submit job (prototype)</button>
    <p id="post-msg" class="small" aria-live="polite"></p>
  </form>
</main>
<footer class="foot"><a href="index.html">← Back to jobs</a></footer>
<script>
const floors = {gb: 12.71, au: 26.44};
document.getElementById('post').addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target), c = f.get('country'), pay = parseFloat(f.get('pay'));
  const msg = document.getElementById('post-msg');
  if (pay < floors[c]) { msg.textContent = `Pay is below the minimum of ${c==='gb'?'£':'A$'}${floors[c]} an hour, so we can't list this job.`; msg.className='small err'; return; }
  msg.textContent = 'Thanks! (Prototype: not sent. In the live version this goes to a moderation queue.)'; msg.className='small ok';
});
</script>
</body>
</html>
